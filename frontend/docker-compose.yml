version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "4321:80"
    volumes:
      - ./out:/usr/share/nginx/html:ro
    command: >
      /bin/sh -c "
      echo 'server {
          listen 80;
          location / {
              root /usr/share/nginx/html;
              try_files $$uri $$uri.html $$uri/ /index.html;
          }
      }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"


