<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Payment Success</title>
    <style>
        :root {
            --bg-dark: #0a0d14;
            --card-bg: #141923;
            --text-light: #f4f6fa;
            --text-muted: #8a99ad;
            --border-color: #262e3d;
            --success: #0070ba;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .result-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .icon {
            font-size: 64px;
            color: var(--success);
            margin-bottom: 20px;
        }

        h2 {
            margin: 0 0 12px;
            font-weight: 600;
            font-size: 24px;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 28px;
        }

        .btn {
            display: inline-block;
            background-color: #0070ba;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #005ea6;
        }
    </style>
</head>
<body>

    <div class="result-card">
        <div class="icon">✓</div>
        <h2>PayPal Payment Success!</h2>
        <p>Thank you for your purchase. Your payment has been processed successfully through PayPal.</p>
        <a href="/payments/" class="btn">Back to Shop</a>
    </div>

</body>
</html>
